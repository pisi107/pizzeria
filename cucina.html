<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Cucina</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h2 { text-align: center; }
        .ordine-card {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-left: 5px solid #ff3b30;
        }
        .ordine-info { font-size: 18px; font-weight: bold; }
        .ordine-dettagli { color: #666; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>👨‍🍳 Ordini in Arrivo</h2>
        <div id="lista-ordini">
            <!-- Gli ordini appariranno qui -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://pizzeria-251a1-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const listaOrdini = document.getElementById('lista-ordini');

        // Ascolta gli ordini nel database
        onValue(ref(db, 'ordini'), (snapshot) => {
            const data = snapshot.val();
            listaOrdini.innerHTML = ''; // Pulisce la lista

            if (data) {
                // Inverte gli ordini per vedere l'ultimo in cima
                Object.values(data).reverse().forEach(ordine => {
                    const div = document.createElement('div');
                    div.className = 'ordine-card';
                    div.innerHTML = `
                        <div class="ordine-info">${ordine.pizza}</div>
                        <div class="ordine-dettagli">
                            Cliente: ${ordine.cliente} <br>
                            Orario: ${ordine.orario}
                        </div>
                    `;
                    listaOrdini.appendChild(div);
                });
            } else {
                listaOrdini.innerHTML = '<p style="text-align:center;">Nessun ordine attivo.</p>';
            }
        });
    </script>
</body>
</html>
