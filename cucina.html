<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Cucina - Ordini</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 20px;
            color: #1d1d1f;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h2 { text-align: center; margin-bottom: 24px; }
        .ordine-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border-left: 6px solid #ff3b30;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ordine-details h3 { margin: 0 0 6px 0; font-size: 18px; }
        .ordine-details p { margin: 0; color: #86868b; font-size: 14px; }
        .ordine-details strong { color: #1d1d1f; }
        .orario {
            font-weight: 600; font-size: 14px; background: #f2f2f7;
            padding: 8px 12px; border-radius: 10px; color: #3a3a3c;
        }
        .vuoto {
            text-align: center; color: #86868b; background: #ffffff;
            padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>👨‍🍳 Ordini in Arrivo</h2>
        <div id="lista-ordini"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://pizzeria-251a1-default-rtdb.europe-west1.firebasedatabase.app" });
        const db = getDatabase(app);

        const listaOrdini = document.getElementById('lista-ordini');

        onValue(ref(db, 'ordini'), (snapshot) => {
            const data = snapshot.val();
            listaOrdini.innerHTML = '';

            if (data) {
                Object.values(data).reverse().forEach(ordine => {
                    const div = document.createElement('div');
                    div.className = 'ordine-card';
                    div.innerHTML = `
                        <div class="ordine-details">
                            <h3>🍕 ${ordine.pizza}</h3>
                            <p>Cliente: <strong>${ordine.cliente}</strong></p>
                        </div>
                        <div class="orario">⏰ ${ordine.orario}</div>
                    `;
                    listaOrdini.appendChild(div);
                });
            } else {
                listaOrdini.innerHTML = '<div class="vuoto">Nessun ordine attivo al momento.</div>';
            }
        });
    </script>
</body>
</html>
