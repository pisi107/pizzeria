<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Cucina - Live</title>
    <style>
        :root {
            --primary: #ff3b30;
            --success: #34c759;
            --bg: #f2f2f7;
            --card-bg: #ffffff;
            --text: #1d1d1f;
            --text-secondary: #86868b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--text);
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header-cucina {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        h2 { margin: 0; font-size: 24px; font-weight: 700; }
        .badge-contatore {
            background: var(--primary);
            color: white;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(255,59,48,0.3);
        }
        .ordine-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border-left: 6px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ordine-details h3 { margin: 0 0 6px 0; font-size: 18px; font-weight: 600; }
        .ordine-details p { margin: 0; color: var(--text-secondary); font-size: 14px; }
        .ordine-details strong { color: var(--text); }
        .destra {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }
        .orario {
            font-weight: 600; font-size: 13px; background: #f2f2f7;
            padding: 6px 10px; border-radius: 8px; color: #3a3a3c;
        }
        .btn-fatto {
            background-color: var(--success);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        .btn-fatto:active { transform: scale(0.95); }
        .vuoto {
            text-align: center; color: var(--text-secondary); background: var(--card-bg);
            padding: 40px 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-cucina">
            <h2>👨‍🍳 Cucina</h2>
            <div id="badge-ordini" class="badge-contatore">0 attivi</div>
        </div>
        <div id="lista-ordini"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://pizzeria-251a1-default-rtdb.europe-west1.firebasedatabase.app" });
        const db = getDatabase(app);

        const listaOrdini = document.getElementById('lista-ordini');
        const badgeOrdini = document.getElementById('badge-ordini');
        
        let primoCaricamento = true;
        let vecchioNumeroOrdini = 0;

        // Funzione per generare un trillo audio dinotifica senza file esterni
        function suonaNotifica() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota D5
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) {
                // I browser bloccano l'audio se prima non c'è un'interazione, gestito in sicurezza
            }
        }

        onValue(ref(db, 'ordini'), (snapshot) => {
            const data = snapshot.val();
            listaOrdini.innerHTML = '';

            if (data) {
                const arrayOrdini = Object.entries(data);
                const numeroOrdini = arrayOrdini.length;

                // Se arriva un ordine nuovo e non è il caricamento iniziale, suona!
                if (!primoCaricamento && numeroOrdini > vecchioNumeroOrdini) {
                    suonaNotifica();
                }
                vecchioNumeroOrdini = numeroOrdini;
                primoCaricamento = false;

                badgeOrdini.innerText = numeroOrdini + (numeroOrdini === 1 ? " attivo" : " attivi");

                arrayOrdini.reverse().forEach(([id, ordine]) => {
                    const div = document.createElement('div');
                    div.className = 'ordine-card';
                    div.innerHTML = `
                        <div class="ordine-details">
                            <h3>🍕 ${ordine.pizza}</h3>
                            <p>Cliente: <strong>${ordine.cliente}</strong></p>
                        </div>
                        <div class="destra">
                            <div class="orario">⏰ ${ordine.orario}</div>
                            <button class="btn-fatto" onclick="completaOrdine('${id}')">Fatto</button>
                        </div>
                    `;
                    listaOrdini.appendChild(div);
                });
            } else {
                primoCaricamento = false;
                vecchioNumeroOrdini = 0;
                badgeOrdini.innerText = "0 attivi";
                listaOrdini.innerHTML = '<div class="vuoto">Nessun ordine attivo al momento. Tutto tranquillo! 🍕</div>';
            }
        });

        window.completaOrdine = function(id) {
            remove(ref(db, 'ordini/' + id));
        };
    </script>
</body>
</html>
