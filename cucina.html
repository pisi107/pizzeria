<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria di Famiglia - Monitor Cucina</title>
    <style>
        :root { --primary: #ff3b30; --success: #34c759; --bg: #f2f2f7; --card-bg: #ffffff; --text: #1d1d1f; --blue: #007aff; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: var(--text); }
        .container { max-width: 700px; margin: 0 auto; }
        
        .audio-box { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: center; border: 2px solid var(--blue); }
        .btn-audio { background: var(--blue); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .section-title { font-size: 18px; font-weight: 700; margin: 25px 0 12px 5px; }
        
        .ospite-box { background: var(--card-bg); padding: 18px; border-radius: 16px; margin-bottom: 25px; display: flex; gap: 10px; }
        .ospite-box input { flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 10px; }
        .btn-ospite { background: var(--blue); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; }

        .order-card { background: white; padding: 20px; border-radius: 16px; margin-bottom: 15px; border-left: 6px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .btn-completato { background: var(--success); color: white; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; }
        
        .history-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .btn-elimina { background: #ffebeb; color: var(--primary); border: none; padding: 8px; border-radius: 8px; cursor: pointer; }
        
        /* Divisore Serata */
        .serata-divider { margin-top: 30px; margin-bottom: 10px; padding: 5px; font-size: 19px; font-weight: 800; border-bottom: 2px solid #000; color: #000; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔔 Monitor Cucina</h2>
    
    <div class="audio-box" id="audio-ui">
        <p>Attiva l'audio per sentire gli ordini:</p>
        <button class="btn-audio" onclick="initAudio()">Attiva Audio</button>
    </div>

    <div class="section-title">👥 Ospite della Serata</div>
    <div class="ospite-box">
        <input type="text" id="input-serata" placeholder="Nome ospite...">
        <button class="btn-ospite" onclick="salvaSerata()">Imposta</button>
    </div>

    <div class="section-title">📋 Ordini Attivi</div>
    <div id="ordini-container"></div>

    <div class="section-title">📜 Cronologia</div>
    <div id="storico-container"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, remove, set, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    
    const db = getDatabase(initializeApp({ databaseURL: "https://pizzeria-251a1-default-rtdb.europe-west1.firebasedatabase.app" }));
    let audioCtx = null;

    window.initAudio = () => {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        document.getElementById('audio-ui').innerHTML = "<p style='color:green; font-weight:bold;'>🔊 Audio Attivo!</p>";
    };

    function suona() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    }

    window.salvaSerata = () => {
        const nome = document.getElementById('input-serata').value;
        if(nome) set(ref(db, 'infoSerata/ospiteCorrente'), nome);
    };

    let primoCaricamento = true;
    onValue(ref(db, 'ordini'), (snapshot) => {
        const ordini = snapshot.val() || {};
        const container = document.getElementById('ordini-container');
        container.innerHTML = '';
        if(!primoCaricamento && Object.keys(ordini).length > 0) suona();
        primoCaricamento = false;

        Object.entries(ordini).forEach(([id, o]) => {
            container.innerHTML += `
                <div class="order-card">
                    <div><strong>${o.cliente}</strong><br>${o.prodotti}</div>
                    <button class="btn-completato" onclick="spostaInStorico('${id}')">Fatto ✓</button>
                </div>`;
        });
    });

    window.spostaInStorico = (id) => {
        const ospite = document.getElementById('input-serata').value || "Serata Generica";
        onValue(ref(db, 'ordini/' + id), (snap) => {
            const o = snap.val();
            if(o) {
                push(ref(db, 'storicoSerate'), { serata: ospite, data: new Date().toLocaleDateString(), dettagli: `${o.cliente} - ${o.prodotti}` });
                remove(ref(db, 'ordini/' + id));
            }
        }, { onlyOnce: true });
    };

    onValue(ref(db, 'storicoSerate'), (snapshot) => {
        const storico = snapshot.val() || {};
        const container = document.getElementById('storico-container');
        container.innerHTML = '';
        let ultimoOspite = "";

        Object.entries(storico).reverse().forEach(([id, s]) => {
            // SE IL NOME OSPITE CAMBIA, CREA IL DIVISORE
            if(s.serata !== ultimoOspite) {
                container.innerHTML += `<div class="serata-divider">🌟 ${s.serata}</div>`;
                ultimoOspite = s.serata;
            }
            container.innerHTML += `
                <div class="history-card">
                    <div>${s.dettagli} <small>(${s.data})</small></div>
                    <button class="btn-elimina" onclick="remove(ref(db, 'storicoSerate/${id}'))">🗑️</button>
                </div>`;
        });
    });
</script>
</body>
</html>
