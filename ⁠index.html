<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Pizza di Casa</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; }
    .card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    button { background: #e63946; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-size: 16px; cursor: pointer; }
    input { width: 100%; padding: 8px; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; }
  </style>
</head>
<body>

  <h2>🍕 Ordina la tua Pizza</h2>
  
  <label for="nome">Il tuo nome:</label>
  <input type="text" id="nome" placeholder="Inserisci il tuo nome">

  <div class="card">
    <h3>Margherita</h3>
    <p>Pomodoro, Mozzarella, Basilico</p>
    <button onclick="inviaOrdine('Margherita')">Ordina Margherita</button>
  </div>

  <div class="card">
    <h3>Diavola</h3>
    <p>Pomodoro, Mozzarella, Salame piccante</p>
    <button onclick="inviaOrdine('Diavola')">Ordina Diavola</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://pizzeria-251a1-default-rtdb.europe-west1.firebasedatabase.app/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.inviaOrdine = function(pizza) {
      const nomeOspite = document.getElementById("nome").value;
      if (!nomeOspite) {
        alert("Inserisci il tuo nome prima di ordinare!");
        return;
      }

      push(ref(db, 'ordini/'), {
        nome: nomeOspite,
        pizza: pizza,
        orario: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        stato: "In attesa"
      }).then(() => {
        alert("Ordine inviato al pizzaiolo! 🍕");
      });
    };
  </script>
</body>
</html>
