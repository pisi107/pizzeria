<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria di Famiglia - Gestione Menu</title>
    <style>
        :root { --primary: #ff3b30; --success: #34c759; --bg: #f2f2f7; --card-bg: #ffffff; --text: #1d1d1f; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; padding-bottom: 60px; color: var(--text); }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { margin: 0 0 5px 0; }
        .header p { color: #86868b; font-size: 14px; margin: 0; }
        
        .section-title { font-size: 18px; font-weight: 700; margin: 25px 0 10px 5px; }
        .card { background: var(--card-bg); padding: 12px 15px; border-radius: 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; }
        .card-info h3 { margin: 0 0 2px 0; font-size: 15px; }
        .card-info p { color: #86868b; font-size: 12px; margin: 0; }

        /* Stile Toggle Switch (Interruttore) */
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 28px; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(22px); }
        
        .status-label { font-size: 12px; font-weight: 600; margin-right: 10px; color: #86868b; }
        .right-side { display: flex; align-items: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>⚙️ Gestione Disponibilità Menu</h2>
            <p>Attiva o disattiva i prodotti in tempo reale per i clienti</p>
        </div>

        <div id="gestione-menu">
            <!-- Verrà popolato dinamicamente o controllato tramite Firebase -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const db = getDatabase(initializeApp({ databaseURL: "https://pizzeria-251a1-default-rtdb.europe-west1.firebasedatabase.app" }));

        // Lista completa di tutti i prodotti divisi per categoria
        const menuStruttura = [
            { categoria: "Pizze", prodotti: [
                { id: "margherita", nome: "Margherita", desc: "Pomodoro, Mozzarella, Basilico" },
                { id: "diavola", nome: "Diavola", desc: "Pomodoro, Mozzarella, Salame piccante" },
                { id: "4formaggi", nome: "4 Formaggi", desc: "Mozzarella, Gorgonzola, Fontina, Parmigiano" },
                { id: "capricciosa", nome: "Capricciosa", desc: "Pomodoro, Mozzarella, Prosciutto, Funghi, Carciofi" },
                { id: "marinara", nome: "Marinara", desc: "Pomodoro, Aglio, Origano, Olio EVO" },
                { id: "vegetariana", nome: "Vegetariana", desc: "Pomodoro, Mozzarella, Zucchine, Melanzane, Peperoni" },
                { id: "prosciuttoefunghi", nome: "Prosciutto e Funghi", desc: "Pomodoro, Mozzarella, Prosciutto cotto, Funghi" },
                { id: "quattrostagioni", nome: "Quattro Stagioni", desc: "Pomodoro, Mozzarella, Prosciutto, Funghi, Carciofi, Olive" },
                { id: "bufalina", nome: "Bufalina", desc: "Pomodoro, Mozzarella di Bufala Campana DOP" },
                { id: "boscaiola", nome: "Boscaiola", desc: "Mozzarella, Salsiccia, Funghi pioppini, Panna" },
                { id: "bresaolaerucola", nome: "Bresaola e Rucola", desc: "Mozzarella, Bresaola, Rucola, Grana" },
                { id: "americana", nome: "Americana", desc: "Pomodoro, Mozzarella, Wurstel, Patatine fritte" },
                { id: "calzoneclassico", nome: "Calzone Classico", desc: "Pomodoro, Mozzarella, Prosciutto cotto, Salame" },
                { id: "napoli", nome: "Napoli", desc: "Pomodoro, Mozzarella, Acciughe, Origano" },
                { id: "romana", nome: "Romana", desc: "Pomodoro, Mozzarella, Acciughe, Capperi" },
                { id: "pugliese", nome: "Pugliese", desc: "Pomodoro, Mozzarella, Cipolla rossa" },
                { id: "salsicciaefriarelli", nome: "Salsiccia e Friarelli", desc: "Mozzarella, Salsiccia, Friarelli napoletani" },
                { id: "tonnoecipolla", nome: "Tonno e Cipolla", desc: "Pomodoro, Mozzarella, Tonno, Cipolla rossa" },
                { id: "siciliana", nome: "Siciliana", desc: "Pomodoro, Mozzarella, Melanzane, Ricotta salata" },
                { id: "tirolese", nome: "Tirolese", desc: "Pomodoro, Mozzarella, Speck, Gorgonzola" },
                { id: "pistacchiosa", nome: "Pistacchiosa", desc: "Mozzarella, Mortadella, Pistacchio, Burrata" }
            ]},
            { categoria: "Focacce", prodotti: [
                { id: "focacciaclassica", nome: "Focaccia Classica", desc: "Olio, Sale, Rosmarino" },
                { id: "focacciacrudo", nome: "Focaccia con Crudo", desc: "Olio, Prosciutto Crudo" }
            ]},
            { categoria: "Bibite", prodotti: [
                { id: "cocacola", nome: "Coca Cola 33cl", desc: "Lattina" },
                { id: "fanta", nome: "Fanta 33cl", desc: "Lattina" },
                { id: "acquanaturale", nome: "Acqua Naturale 0.75l", desc: "Bottiglia" },
                { id: "acquafrizzante", nome: "Acqua Frizzante 0.75l", desc: "Bottiglia" }
            ]},
            { categoria: "Birre", prodotti: [
                { id: "birraartigianale", nome: "Birra Artigianale 33cl", desc: "Bottiglia" },
                { id: "birrachiara", nome: "Birra Chiara 66cl", desc: "Bottiglia" },
                { id: "birrarossa", nome: "Birra Rossa 33cl", desc: "Bottiglia" }
            ]},
            { categoria: "Vini", prodotti: [
                { id: "vinorosso", nome: "Calice di Vino Rosso", desc: "Calice" },
                { id: "vinobianco", nome: "Calice di Vino Bianco", desc: "Calice" },
                { id: "chianti", nome: "Bottiglia di Chianti", desc: "Bottiglia" }
            ]}
        ];

        const container = document.getElementById('gestione-menu');

        // Ascolta lo stato di disponibilità dal database in tempo reale
        const dispRef = ref(db, 'disponibilita');
        
        onValue(dispRef, (snapshot) => {
            const statoSalvataggio = snapshot.val() || {};
            
            container.innerHTML = '';

            menuStrutturaforEach(catObj => {
                // Titolo Categoria
                const titolo = document.createElement('div');
                titolo.className = 'section-title';
                titolo.innerText = catObj.categoria;
                container.appendChild(titolo);

                catObj.prodotti.forEach(prod => {
                    // Se non è specificato nel DB, di default è disponibile (true)
                    const isDisponibile = statoSalvataggio[prod.id] !== undefined ? statoSalvataggio[prod.id] : true;

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-info">
                            <h3>${prod.nome}</h3>
                            <p>${prod.desc}</p>
                        </div>
                        <div class="right-side">
                            <span class="status-label">${isDisponibile ? 'Disponibile' : 'Esaurito'}</span>
                            <label class="switch">
                                <input type="checkbox" ${isDisponibile ? 'checked' : ''} onchange="aggiornaStato('${prod.id}', this.checked)">
                                <span class="slider"></span>
                            </label>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        });

        // Funzione globale per cambiare lo stato su Firebase quando tocchi l'interruttore
        window.aggiornaStato = (idProdotto, stato) => {
            set(ref(db, `disponibilita/${idProdotto}`), stato);
        };
    </script>
</body>
</html>
