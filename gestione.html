<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Gestione Menu</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
    .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <h1>⚙️ Gestione Disponibilità Pizze</h1>

  <!-- Ecco la lista di tutte le tue pizze -->
  <div id="lista-pizze">
    <!-- Le pizze verranno caricate qui sotto -->
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "LA_TUA_API_KEY",
      authDomain: "TUO-PROGETTO.firebaseapp.com",
      databaseURL: "https://TUO-PROGETTO-default-rtdb.firebaseio.com",
      projectId: "TUO-PROGETTO",
      storageBucket: "TUO-PROGETTO.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Lista esatta delle pizze che hai nel menu
    const pizze = [
      'margherita', 'diavola', '4formaggi', 'capricciosa', 'marinara', 
      'vegetariana', 'prosciuttoefunghi', 'quattrostagioni', 'bufalina', 
      'boscaiola', 'bresaolaerucola', 'americana', 'calzoneclassico', 
      'napoli', 'romana', 'pugliese', 'salsicciaefriarelli', 
      'tonnoecipolla', 'siciliana', 'tirolese', 'pistacchiosa'
    ];

    const container = document.getElementById('lista-pizze');

    // Crea gli interruttori automaticamente
    pizze.forEach(pizza => {
      container.innerHTML += `
        <div class="card">
          <span>${pizza.toUpperCase()}</span>
          <input type="checkbox" id="check-${pizza}" checked onchange="cambiaStato('${pizza}')">
        </div>
      `;
    });

    // Legge lo stato dal database per aggiornare gli interruttori
    onValue(ref(db, 'disponibilita'), (snapshot) => {
      const data = snapshot.val() || {};
      pizze.forEach(pizza => {
        const checkbox = document.getElementById('check-' + pizza);
        if (checkbox) {
          // Se nel database non c'è, default a true (acceso)
          checkbox.checked = data[pizza] !== undefined ? data[pizza] : true;
        }
      });
    });

    // Funzione globale per cambiare stato
    window.cambiaStato = function(pizza) {
      const isChecked = document.getElementById('check-' + pizza).checked;
      set(ref(db, 'disponibilita/' + pizza), isChecked);
    };
  </script>
</body>
</html>
