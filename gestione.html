<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestione</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .box { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <h2>⚙️ Gestione Pizze</h2>
    <div id="controlli"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const app = initializeApp({ 
            databaseURL: "https://pizzeria-251a1-default-rtdb.europe-west1.firebasedatabase.app" 
        });
        const db = getDatabase(app);
        
        const pizze = ['Margherita', 'Diavola'];
        const container = document.getElementById('controlli');

        pizze.forEach(p => {
            container.innerHTML += `<div class="box"><span>${p}</span><input type="checkbox" id="chk-${p}" checked onchange="aggiorna('${p}', this.checked)"></div>`;
        });

        window.aggiorna = (p, stato) => {
            set(ref(db, 'disponibilita/' + p), stato);
        };

        onValue(ref(db, 'disponibilita'), (snapshot) => {
            const data = snapshot.val() || {};
            pizze.forEach(p => {
                const chk = document.getElementById('chk-' + p);
                if(chk) chk.checked = data[p] !== false;
            });
        });
    </script>
</body>
</html>
