<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Disponibilità Pizze</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .pizza-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .pizza-item:last-child {
            border-bottom: none;
        }
        .pizza-name {
            font-weight: 600;
            font-size: 16px;
            text-transform: uppercase;
        }
        /* Stile interruttore (Switch) */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 26px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #34c759;
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚙️ Gestione Disponibilità Pizze</h2>
        <div id="lista-gestione">
            <!-- Gli interruttori verranno generati automaticamente qui dentro -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // INSERISCI QUI LA TUA CONFIGURAZIONE FIREBASE ESATTA
        const firebaseConfig = {
            databaseURL: "https://pizzeria-251a1-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const pizze = [
            'margherita', 'diavola', '4formaggi', 'capricciosa', 'marinara', 
            'vegetariana', 'prosciuttoefunghi', 'quattrostagioni', 'bufalina', 
            'boscaiola', 'bresaolaerucola', 'americana', 'calzoneclassico', 
            'napoli', 'romana', 'pugliese', 'salsicciaefriarelli', 
            'tonnoecipolla', 'siciliana', 'tirolese', 'pistacchiosa'
        ];

        const container = document.getElementById('lista-gestione');

        // Crea la lista visiva degli interruttori
        pizze.forEach(nome => {
            const div = document.createElement('div');
            div.className = 'pizza-item';
            div.innerHTML = `
                <span class="pizza-name">${nome}</span>
                <label class="switch">
                    <input type="checkbox" id="check-${nome}" checked>
                    <span class="slider"></span>
                </label>
            `;
            container.appendChild(div);

            // Aggiungi l'evento al cambiamento dell'interruttore
            const checkbox = document.getElementById(`check-${nome}`);
            checkbox.addEventListener('change', (e) => {
                const statoDisponibile = e.target.checked;
                // Salva lo stato su Firebase nel percorso corretto 'disponibilita/nome_pizza'
                set(ref(db, 'disponibilita/' + nome), statoDisponibile);
            });
        });

        // Sincronizza lo stato iniziale degli interruttori leggendo da Firebase
        onValue(ref(db, 'disponibilita'), (snapshot) => {
            const data = snapshot.val() || {};
            pizze.forEach(nome => {
                const checkbox = document.getElementById(`check-${nome}`);
                if (checkbox) {
                    // Se nel database è esplicitamente false, spegne l'interruttore, altrimenti lo accende
                    checkbox.checked = data[nome] !== false;
                }
            });
        });
    </script>
</body>
</html>
