<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Pizzeria</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f4; max-width: 500px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background: #e63946; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2>🍕 Ordina la tua Pizza</h2>

    <label for="nome"><b>Il tuo nome:</b></label>
    <input type="text" id="nome" placeholder="Inserisci il tuo nome">

   <button id="btn-margherita" onclick="inviaOrdine('Margherita')">Ordina Margherita</button>

<button id="btn-diavola" onclick="inviaOrdine('Diavola')">Ordina Diavola</button>

<button id="btn-4formaggi" onclick="inviaOrdine('4 Formaggi')">Ordina 4 Formaggi</button>

<button id="btn-capricciosa" onclick="inviaOrdine('Capricciosa')">Ordina Capricciosa</button>

<button id="btn-marinara" onclick="inviaOrdine('Marinara')">Ordina Marinara</button>

<button id="btn-vegetariana" onclick="inviaOrdine('Vegetariana')">Ordina Vegetariana</button>

<button id="btn-prosciuttoefunghi" onclick="inviaOrdine('Prosciutto e Funghi')">Ordina Prosciutto e Funghi</button>

<button id="btn-quattrostagioni" onclick="inviaOrdine('Quattro Stagioni')">Ordina Quattro Stagioni</button>

<button id="btn-bufalina" onclick="inviaOrdine('Bufalina')">Ordina Bufalina</button>

<button id="btn-boscaiola" onclick="inviaOrdine('Boscaiola')">Ordina Boscaiola</button>

<button id="btn-bresaolaerucola" onclick="inviaOrdine('Bresaola e Rucola')">Ordina Bresaola e Rucola</button>

<button id="btn-americana" onclick="inviaOrdine('Americana')">Ordina Americana</button>

<button id="btn-calzoneclassico" onclick="inviaOrdine('Calzone Classico')">Ordina Calzone Classico</button>

<button id="btn-napoli" onclick="inviaOrdine('Napoli')">Ordina Napoli</button>

<button id="btn-romana" onclick="inviaOrdine('Romana')">Ordina Romana</button>

<button id="btn-pugliese" onclick="inviaOrdine('Pugliese')">Ordina Pugliese</button>

<button id="btn-salsicciaefriarelli" onclick="inviaOrdine('Salsiccia e Friarelli')">Ordina Salsiccia e Friarelli</button>

<button id="btn-tonnoecipolla" onclick="inviaOrdine('Tonno e Cipolla')">Ordina Tonno e Cipolla</button>

<button id="btn-siciliana" onclick="inviaOrdine('Siciliana')">Ordina Siciliana</button>

<button id="btn-tirolese" onclick="inviaOrdine('Tirolese')">Ordina Tirolese</button>

<button id="btn-pistacchiosa" onclick="inviaOrdine('Pistacchiosa')">Ordina Pistacchiosa</button>


    


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://pizzeria-251a1-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.inviaOrdine = function(pizza) {
            const nomeCliente = document.getElementById('nome').value;
            
            if (!nomeCliente) {
                alert("Per favore, inserisci il tuo nome prima di ordinare!");
                return;
            }

            push(ref(db, 'ordini'), {
                cliente: nomeCliente,
                pizza: pizza,
                orario: new Date().toLocaleTimeString()
            }).then(() => {
                alert("Ordine inviato in cucina per " + nomeCliente + "!");
            }).catch((error) => {
                alert("Errore nell'invio dell'ordine: " + error.message);
            });
        };
        // Ascolta le modifiche della disponibilità pizze
db.ref('disponibilita').on('value', (snapshot) => {
  const disponibilita = snapshot.val() || {};

  // Lista ID dei pulsanti delle pizze
  const pizze = ['margherita', 'diavola', '4formaggi', 'capricciosa'];

  pizze.forEach((pizza) => {
    // Trova il pulsante della pizza (assicurati che il pulsante abbia id="btn-margherita", ecc.)
    const btn = document.getElementById('btn-' + pizza);
    
    if (btn) {
      if (disponibilita[pizza] === false) {
        btn.disabled = true;
        btn.innerText = "Esaurita";
        btn.style.backgroundColor = "#cccccc";
      } else {
        btn.disabled = false;
        btn.innerText = "Ordina " + pizza.charAt(0).toUpperCase() + pizza.slice(1);
        btn.style.backgroundColor = "#ff3b30";
      }
    }
  });
});

    </script>

</body>
</html>
