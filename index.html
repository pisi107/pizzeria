<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trattoria di Famiglia 🍕</title>
    <style>
        :root { 
            --primary: #8b0000; 
            --success: #2e7d32; 
            --bg: #f7f3e8; 
            --card-bg: #fffdf9; 
            --text: #2c221e; 
            --gray: #7d7065; 
            --accent: #d4a373; 
        }

        body { 
            font-family: "Georgia", serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 20px; 
            padding-bottom: 100px; 
            color: var(--text); 
        }

        .container { max-width: 550px; margin: 0 auto; }

        /* Stile Antico / Menu Ristorante */
        .header { 
            background: var(--card-bg); 
            color: var(--text); 
            padding: 30px 20px; 
            border-radius: 12px; 
            text-align: center; 
            margin-bottom: 25px; 
            border: 3px double var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .header h1 { margin: 0 0 8px 0; font-size: 28px; font-weight: normal; font-style: italic; letter-spacing: 1px; color: var(--primary); }
        .header p { margin: 0; font-size: 15px; font-style: italic; color: var(--gray); }

        /* Box Stato Serata */
        .serata-banner { 
            background: var(--card-bg); 
            padding: 14px 18px; 
            border-radius: 10px; 
            margin-bottom: 25px; 
            border: 1px solid var(--accent);
            display: flex; 
            align-items: center; 
            gap: 12px;
        }
        .serata-banner span { font-size: 16px; }

        /* Sezioni */
        .section-title { 
            font-size: 20px; 
            font-style: italic; 
            font-weight: normal; 
            margin: 30px 0 15px 5px; 
            color: var(--primary);
            border-bottom: 1px dashed var(--accent);
            padding-bottom: 5px;
        }

        /* Card Form Ordine */
        .card-form { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 12px; 
            border: 1px solid var(--accent); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
            margin-bottom: 25px; 
        }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 14px; font-style: italic; font-weight: bold; margin-bottom: 8px; color: var(--gray); }
        
        .input-group input { 
            width: 100%; 
            padding: 12px 16px; 
            border: 1px solid var(--accent); 
            border-radius: 8px; 
            font-size: 16px; 
            font-family: "Georgia", serif;
            outline: none; 
            box-sizing: border-box; 
            background: #fff;
            color: var(--text);
        }
        .input-group input:focus { border-color: var(--primary); }

        /* Menu Categorie in stile antico */
        .category-subtitle { font-size: 15px; font-style: italic; font-weight: bold; color: var(--primary); margin: 20px 0 10px 2px; }
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 8px; 
        }
        .btn-menu-item { 
            background: #fdfbf7; 
            border: 1px solid #e8dfd1; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 14px; 
            font-style: italic;
            color: var(--text); 
            cursor: pointer; 
            text-align: left;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-menu-item:hover { background: #f4ecdf; border-color: var(--accent); }
        .btn-menu-item:active { transform: scale(0.98); }

        /* Pulsante Invia Ordine */
        .btn-invia { 
            background: var(--primary); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 16px; 
            border-radius: 8px; 
            font-size: 16px; 
            font-style: italic; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(139, 0, 0, 0.2);
            margin-top: 15px;
        }
        .btn-invia:active { transform: scale(0.98); }

        /* Lista Ordini Inviati */
        .order-status-card { 
            background: var(--card-bg); 
            padding: 16px 20px; 
            border-radius: 10px; 
            margin-bottom: 12px; 
            border: 1px solid var(--accent); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .badge-attivo { 
            background: #e8f5e9; 
            color: var(--success); 
            padding: 6px 12px; 
            border-radius: 15px; 
            font-size: 12px; 
            font-style: italic; 
            font-weight: bold; 
        }

        .empty-state { 
            text-align: center; 
            color: var(--gray); 
            font-style: italic; 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 10px; 
            border: 1px solid var(--accent); 
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- HEADER -->
    <div class="header">
        <h1>~ Pizzeria di Famiglia ~</h1>
        <p>Il nostro menu artigianale, direttamente in tavola</p>
    </div>

    <!-- BANNER SERATA IN CORSO -->
    <div class="serata-banner">
        <span>✨</span>
        <div id="display-serata" style="font-style: italic; color: var(--text); font-size: 15px;">Caricamento serata...</div>
    </div>

    <!-- CARD FORM ORDINE -->
    <div class="section-title">La Vostra Ordinazione</div>
    <div class="card-form">
        <div class="input-group">
            <label for="input-cliente">Il Vostro Nome</label>
            <input type="text" id="input-cliente" placeholder="es. Marco, Sara, Nonno...">
        </div>

        <div class="input-group">
            <label>Le Nostre Proposte (clicca per aggiungere)</label>
            
            <!-- Pizze Classiche -->
            <div class="category-subtitle">- Pizze Classiche -</div>
            <div class="menu-grid">
                <button type="button" class="btn-menu-item" onclick="aggiungiVoce('Margherita')"><span>Margherita</span> ➕</button>
                <button type="button" class="btn-menu-item" onclick="aggiungiVoce('Marinara')"><span>Marinara</span> ➕</button>
                <button type="button" class="btn-menu-item" onclick="aggiungiVoce('Diavola')"><span>Diavola</span> ➕</button>
                <button type="button" class="btn-menu-item" onclick="aggiungiVoce('Capricciosa')"><span>Capricciosa</span> ➕</button>
                <button type="button" class="btn-menu-item" onclick="aggiungiVoce('Quattro Formaggi')"><span>4 Formaggi</span> ➕</button>
                <button type="button" class="btn-menu-item" onclick="aggiungiVoce('Wudy e Patatine')"><span>Wudy e Patatine</span> ➕</button>
            </div>

            <!-- Focacce & Speciali -->
            <div class="category-subtitle">- Focacce & Speciali -</div>
            <div class="menu-grid">
                <button type="button" class="btn-menu-item" onclick="aggiungiVoce('Focaccia Liscia')"><span>Focaccia Liscia</span> ➕</button>
                <button type="button" class="btn-menu-item" onclick="aggiungiVoce('Focaccia Rosmarino')"><span>Rosmarino / Olio</span> ➕</button>
                <button type="button" class="btn-menu-item" onclick="aggiungiVoce('Pizza Speciale dello Chef')"><span>Speciale dello Chef</span> ➕</button>
            </div>

            <!-- Bibite & Birre -->
            <div class="category-subtitle">- Bibite & Cantina -</div>
            <div class="menu-grid">
                <button type="button" class="btn-menu-item" onclick="aggiungiVoce('Coca Cola')"><span>Coca Cola</span> ➕</button>
                <button type="button" class="btn-menu-item" onclick="aggiungiVoce('Acqua Naturale')"><span>Acqua Naturale</span> ➕</button>
                <button type="button" class="btn-menu-item" onclick="aggiungiVoce('Acqua Frizzante')"><span>Acqua Frizzante</span> ➕</button>
                <button type="button" class="btn-menu-item" onclick="aggiungiVoce('Birra')"><span>Birra artigianale</span> ➕</button>
            </div>
        </div>

        <div class="input-group">
            <label for="input-prodotti">Il vostro ordine</label>
            <input type="text" id="input-prodotti" placeholder="es. Margherita + Coca Cola">
        </div>

        <button class="btn-invia" onclick="inviaOrdine()">Invia l'Ordine alla Cucina 🍷</button>
    </div>

    <!-- I MIEI ORDINI ATTIVI -->
    <div class="section-title">I Vostri Ordini in Corso</div>
    <div id="miei-ordini-container">
        <div class="empty-state">Nessun ordine registrato al momento.</div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    
    const db = getDatabase(initializeApp({ databaseURL: "https://pizzeria-251a1-default-rtdb.europe-west1.firebasedatabase.app" }));

    window.aggiungiVoce = (voce) => {
        const inputProdotti = document.getElementById('input-prodotti');
        if (inputProdotti.value.trim() === "") {
            inputProdotti.value = voce;
        } else {
            inputProdotti.value += " + " + voce;
        }
    };

    onValue(ref(db, 'infoSerata/ospiteCorrente'), (snapshot) => {
        const ospite = snapshot.val();
        const display = document.getElementById('display-serata');
        if(ospite) {
            display.innerText = `Serata dedicata a: "${ospite}"`;
        } else {
            display.innerText = `Serata Pizzeria di Famiglia`;
        }
    });

    window.inviaOrdine = () => {
        const cliente = document.getElementById('input-cliente').value.trim();
        const prodotti = document.getElementById('input-prodotti').value.trim();
        
        if(!cliente) {
            alert("Per favore, inserite il vostro nome.");
            document.getElementById('input-cliente').focus();
            return;
        }
        if(!prodotti) {
            alert("Selezionate o scrivete qualcosa dal menu.");
            document.getElementById('input-prodotti').focus();
            return;
        }

        const orarioCorrente = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        push(ref(db, 'ordini'), {
            cliente: cliente,
            prodotti: prodotti,
            orario: orarioCorrente
        });

        localStorage.setItem('pizzeria_nome_utente', cliente);
        document.getElementById('input-prodotti').value = '';
        alert("Ordine trasmesso con successo alla cucina! 🍕");
    };

    window.addEventListener('DOMContentLoaded', () => {
        const salvato = localStorage.getItem('pizzeria_nome_utente');
        if(salvato) {
            document.getElementById('input-cliente').value = salvato;
        }
    });

    onValue(ref(db, 'ordini'), (snapshot) => {
        const ordini = snapshot.val() || {};
        const container = document.getElementById('miei-ordini-container');
        
        container.innerHTML = '';
        let ordiniTrovati = false;

        Object.entries(ordini).forEach(([id, o]) => {
            container.innerHTML += `
                <div class="order-status-card">
                    <div>
                        <strong style="font-size: 16px; font-style: italic; color: var(--text);">👤 ${o.cliente}</strong><br>
                        <span style="font-size: 14px; font-style: italic; color: var(--gray);">🍕 ${o.prodotti}</span><br>
                        <small style="color: var(--gray); font-style: italic;">${o.orario}</small>
                    </div>
                    <span class="badge-attivo">In preparazione</span>
                </div>`;
            ordiniTrovati = true;
        });

        if (!ordiniTrovati) {
            container.innerHTML = '<div class="empty-state">Nessun ordine registrato al momento.</div>';
        }
    });
</script>

</body>
</html>
