<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Menu Pizza</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        button { background: #ff3b30; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    </style>
</head>
<body>
    <h2>🍕 Menu Pizzeria</h2>
    <input type="text" id="nome" placeholder="Il tuo nome">
    <div class="card">
        <h3>Margherita</h3>
        <button onclick="inviaOrdine('Margherita')">Ordina Margherita</button>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ 
            databaseURL: "https://pizzeria-251a1-default-rtdb.europe-west1.firebasedatabase.app" 
        });
        const db = getDatabase(app);

        window.inviaOrdine = (pizza) => {
            const nome = document.getElementById('nome').value.trim();
            if(!nome) {
                alert("Scrivi il tuo nome prima di ordinare!");
                return;
            }
            push(ref(db, 'ordini'), { 
                cliente: nome, 
                pizza: pizza, 
                orario: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
            })
            .then(() => alert("Ordine inviato con successo!"))
            .catch((err) => alert("Errore: " + err.message));
        };
    </script>
</body>
</html>
