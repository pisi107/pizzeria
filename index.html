<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu & Carrello - Pizzeria Master</title>
    <style>
        :root {
            --primary: #ff3b30;
            --success: #34c759;
            --bg: #f2f2f7;
            --card-bg: #ffffff;
            --text: #1d1d1f;
        }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; padding-bottom: 100px; color: var(--text); }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 24px; }
        .input-group { background: var(--card-bg); padding: 16px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #d2d2d7; border-radius: 12px; }
        
        .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; }
        .cat-btn { background: var(--card-bg); border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; color: #86868b; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { background: var(--primary); color: white; }

        .section-title { font-size: 18px; font-weight: 700; margin: 20px 0 10px 5px; }
        .card { background: var(--card-bg); padding: 16px; border-radius: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .card-info { flex-grow: 1; }
        .card h3 { margin: 0; font-size: 16px; }
        .card p { color: #86868b; font-size: 12px; margin: 2px 0 8px 0; }
        button.btn-add { background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }

        /* PULSANTE CARRELLO FLUTTUANTE */
        #cart-fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--success);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(52, 199, 89, 0.4);
            cursor: pointer;
            z-index: 1000;
            border: none;
        }
        #cart-count-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--primary);
            color: white;
            font-size: 12px;
            font-weight: bold;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* MODALE */
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); display: none; align-items: flex-end; z-index: 2000; }
        .modal-content { background: white; width: 100%; max-width: 600px; border-radius: 24px 24px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto; }
        .btn-send { width: 100%; background: var(--success); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header"><h2>🍕 Pizzeria Master</h2></div>
        <div class="input-group">
            <input type="text" id="nome" placeholder="Il tuo Nome o Tavolo...">
        </div>

        <div class="categories">
            <button class="cat-btn active" onclick="filtra('tutte', this)">Tutto</button>
            <button class="cat-btn" onclick="filtra('pizze', this)">Pizze</button>
            <button class="cat-btn" onclick="filtra('bibite', this)">Bibite</button>
        </div>

        <div id="menu-container">
            <div class="categoria-group" data-cat="pizze">
                <div class="section-title">Pizze</div>
                <div class="card"><div class="card-info"><h3>Margherita</h3><p>Pomodoro, Mozzarella</p><button class="btn-add" onclick="aggiungi('Margherita')">Aggiungi</button></div></div>
                <div class="card"><div class="card-info"><h3>Diavola</h3><p>Salame piccante</p><button class="btn-add" onclick="aggiungi('Diavola')">Aggiungi</button></div></div>
            </div>
            <div class="categoria-group" data-cat="bibite">
                <div class="section-title">Bibite</div>
                <div class="card"><div class="card-info"><h3>Coca Cola</h3><button class="btn-add" onclick="aggiungi('Coca Cola')">Aggiungi</button></div></div>
            </div>
        </div>
    </div>

    <!-- Pulsante Fluttuante -->
    <button id="cart-fab" onclick="apriModal()">
        🛒
        <span id="cart-count-badge">0</span>
    </button>

    <!-- Modale Carrello -->
    <div id="modal" class="modal-overlay" onclick="chiudiModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>Il tuo ordine</h3>
            <div id="lista-carrello"></div>
            <button class="btn-send" onclick="invia()">Invia Ordine</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const db = getDatabase(initializeApp({ databaseURL: "https://pizzeria-251a1-default-rtdb.europe-west1.firebasedatabase.app" }));
        let carrello = [];

        window.aggiungi = (nome) => {
            carrello.push(nome);
            document.getElementById('cart-count-badge').innerText = carrello.length;
            document.getElementById('cart-fab').style.display = 'flex';
        };

        window.apriModal = () => {
            const lista = document.getElementById('lista-carrello');
            lista.innerHTML = carrello.map((item, index) => `<p>${index+1}. ${item}</p>`).join('');
            document.getElementById('modal').style.display = 'flex';
        };

        window.chiudiModal = () => document.getElementById('modal').style.display = 'none';

        window.invia = () => {
            const nome = document.getElementById('nome').value;
            if(!nome) return alert("Inserisci il nome!");
            push(ref(db, 'ordini'), { cliente: nome, prodotti: carrello.join(', ') });
            alert("Ordine inviato!");
            carrello = [];
            document.getElementById('cart-count-badge').innerText = '0';
            document.getElementById('cart-fab').style.display = 'none';
            chiudiModal();
        };

        window.filtra = (cat, btn) => {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.categoria-group').forEach(g => {
                g.style.display = (cat === 'tutte' || g.getAttribute('data-cat') === cat) ? 'block' : 'none';
            });
        };
    </script>
</body>
</html>
