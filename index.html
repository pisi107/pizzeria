<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria di Famiglia 🍕</title>
    <style>
        :root { 
            --primary: #ff3b30; 
            --primary-hover: #e0322b;
            --success: #34c759; 
            --bg: #f8f8fa; 
            --card-bg: #ffffff; 
            --text: #1d1d1f; 
            --gray: #86868b; 
            --blue: #007aff; 
            --radius: 18px;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 20px; 
            padding-bottom: 100px; 
            color: var(--text); 
        }

        .container { max-width: 550px; margin: 0 auto; }

        /* Header Accattivante */
        .header { 
            background: linear-gradient(135deg, #ff3b30, #ff9500); 
            color: white; 
            padding: 25px 20px; 
            border-radius: var(--radius); 
            text-align: center; 
            margin-bottom: 25px; 
            box-shadow: 0 8px 25px rgba(255, 59, 48, 0.25); 
        }
        .header h1 { margin: 0 0 8px 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .header p { margin: 0; font-size: 15px; opacity: 0.95; font-weight: 500; }

        /* Box Stato Serata / Ospite */
        .serata-banner { 
            background: white; 
            padding: 14px 18px; 
            border-radius: 14px; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.04); 
            display: flex; 
            align-items: center; 
            gap: 12px;
            border-left: 5px solid var(--blue);
        }
        .serata-banner span { font-size: 15px; font-weight: 600; color: var(--text); }

        /* Sezioni */
        .section-title { 
            font-size: 19px; 
            font-weight: 800; 
            margin: 25px 0 15px 5px; 
            letter-spacing: -0.3px;
        }

        /* Form Ordinazione */
        .card-form { 
            background: var(--card-bg); 
            padding: 22px; 
            border-radius: var(--radius); 
            box-shadow: 0 6px 20px rgba(0,0,0,0.05); 
            margin-bottom: 25px; 
        }
        
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; color: #444; }
        
        .input-group input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 2px solid #e5e5ea; 
            border-radius: 12px; 
            font-size: 16px; 
            outline: none; 
            box-sizing: border-box; 
            transition: all 0.2s ease;
            background: #fafafc;
        }
        .input-group input:focus { border-color: var(--blue); background: #fff; box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }

        /* Pulsanti Prodotti / Categorie veloci */
        .quick-pizze { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
            margin-bottom: 15px; 
        }
        .btn-pizza-preset { 
            background: #f1f1f6; 
            border: 2px solid transparent; 
            padding: 12px; 
            border-radius: 12px; 
            font-size: 14px; 
            font-weight: 700; 
            color: #333; 
            cursor: pointer; 
            text-align: left;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-pizza-preset:hover { background: #e5e5ea; border-color: #d1d1d6; }
        .btn-pizza-preset.active { background: #e8f4fd; border-color: var(--blue); color: var(--blue); }

        /* Pulsante Invia Ordine Gigante */
        .btn-invia { 
            background: linear-gradient(135deg, var(--success), #28a745); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 16px; 
            border-radius: 14px; 
            font-size: 17px; 
            font-weight: 800; 
            cursor: pointer; 
            box-shadow: 0 6px 20px rgba(52, 199, 89, 0.35);
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-invia:active { transform: scale(0.98); }

        /* Lista Ordini Inviati dall'ospite */
        .order-status-card { 
            background: white; 
            padding: 16px 20px; 
            border-radius: 14px; 
            margin-bottom: 12px; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.03); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-left: 5px solid var(--success);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .badge-attivo { 
            background: #e1f5fe; 
            color: #0288d1; 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 700; 
            text-transform: uppercase;
        }

        .empty-state { 
            text-align: center; 
            color: var(--gray); 
            font-style: italic; 
            background: white; 
            padding: 25px; 
            border-radius: var(--radius); 
            box-shadow: 0 3px 10px rgba(0,0,0,0.02); 
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- HEADER -->
    <div class="header">
        <h1>🍕 Pizzeria di Famiglia</h1>
        <p>Scegli la tua pizza e ordinala al volo!</p>
    </div>

    <!-- BANNER SERATA IN CORSO -->
    <div class="serata-banner">
        <span style="font-size: 20px;">✨</span>
        <div id="display-serata" style="font-weight: 700; color: #333; font-size: 15px;">Caricamento serata...</div>
    </div>

    <!-- CARD FORM ORDINE -->
    <div class="section-title">📝 Fai il tuo Ordine</div>
    <div class="card-form">
        <div class="input-group">
            <label for="input-cliente">Il tuo Nome</label>
            <input type="text" id="input-cliente" placeholder="es. Marco, Sara, Nonno...">
        </div>

        <div class="input-group">
            <label>Scelte Rapide (tocca per aggiungere)</label>
            <div class="quick-pizze">
                <button type="button" class="btn-pizza-preset" onclick="aggiungiPizza('Margherita 🍅')"><span>Margherita</span> ➕</button>
                <button type="button" class="btn-pizza-preset" onclick="aggiungiPizza('Diavola 🌶️')"><span>Diavola</span> ➕</button>
                <button type="button" class="btn-pizza-preset" onclick="aggiungiPizza('Capricciosa 🍄')"><span>Capricciosa</span> ➕</button>
                <button type="button" class="btn-pizza-preset" onclick="aggiungiPizza('Wudy / Patatine 🍟')"><span>Bambini</span> ➕</button>
            </div>
        </div>

        <div class="input-group">
            <label for="input-prodotti">Cosa desideri ordinare?</label>
            <input type="text" id="input-prodotti" placeholder="es. 1 Margherita e una Coca Cola">
        </div>

        <button class="btn-invia" onclick="inviaOrdine()">Invia in Cucina 🚀</button>
    </div>

    <!-- I MIEI ORDINI ATTIVI -->
    <div class="section-title">📋 I tuoi Ordini in Corso</div>
    <div id="miei-ordini-container">
        <div class="empty-state">Non hai ancora inviato ordini stasera.</div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    
    const db = getDatabase(initializeApp({ databaseURL: "https://pizzeria-251a1-default-rtdb.europe-west1.firebasedatabase.app" }));

    // Funzione per aggiungere rapidamente le pizze al campo di testo
    window.aggiungiPizza = (testoPizza) => {
        const inputProdotti = document.getElementById('input-prodotti');
        if (inputProdotti.value.trim() === "") {
            inputProdotti.value = testoPizza;
        } else {
            inputProdotti.value += " + " + testoPizza;
        }
    };

    // Leggi il nome della serata impostata in cucina
    onValue(ref(db, 'infoSerata/ospiteCorrente'), (snapshot) => {
        const ospite = snapshot.val();
        const display = document.getElementById('display-serata');
        if(ospite) {
            display.innerText = `Serata: "${ospite}"`;
        } else {
            display.innerText = `Serata Pizzeria di Famiglia`;
        }
    });

    // Funzione per inviare l'ordine
    window.inviaOrdine = () => {
        const cliente = document.getElementById('input-cliente').value.trim();
        const prodotti = document.getElementById('input-prodotti').value.trim();
        
        if(!cliente) {
            alert("Per favore, inserisci il tuo nome!");
            document.getElementById('input-cliente').focus();
            return;
        }
        if(!prodotti) {
            alert("Scrivi cosa vorresti ordinare!");
            document.getElementById('input-prodotti').focus();
            return;
        }

        const orarioCorrente = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        push(ref(db, 'ordini'), {
            cliente: cliente,
            prodotti: prodotti,
            orario: orarioCorrente
        });

        // Salva il nome nel browser così la prossima volta non deve riscriverlo
        localStorage.setItem('pizzeria_nome_utente', cliente);

        // Pulisci solo i prodotti, mantieni il nome
        document.getElementById('input-prodotti').value = '';
        alert("Ordine inviato con successo alla cucina! 🍕🔥");
    };

    // Riempi automaticamente il nome se l'utente lo aveva già inserito in precedenza
    window.addEventListener('DOMContentLoaded', () => {
        const salvato = localStorage.getItem('pizzeria_nome_utente');
        if(salvato) {
            document.getElementById('input-cliente').value = salvato;
        }
    });

    // Ascolta gli ordini attivi per mostrare all'ospite cosa ha in sospeso
    onValue(ref(db, 'ordini'), (snapshot) => {
        const ordini = snapshot.val() || {};
        const container = document.getElementById('miei-ordini-container');
        const nomeCorrente = document.getElementById('input-cliente').value.trim().toLowerCase();
        
        container.innerHTML = '';
        let mieiOrdiniTrovati = false;

        Object.entries(ordini).forEach(([id, o]) => {
            // Mostriamo gli ordini se corrispondono al nome inserito (o mostriamo tutti se il campo è vuoto per comodità)
            container.innerHTML += `
                <div class="order-status-card">
                    <div>
                        <strong style="font-size: 16px; color: #111;">👤 ${o.cliente}</strong><br>
                        <span style="font-size: 14px; color: #444; font-weight: 500;">🍕 ${o.prodotti}</span><br>
                        <small style="color: var(--gray);">${o.orario}</small>
                    </div>
                    <span class="badge-attivo">In preparazione</span>
                </div>`;
            mieiOrdiniTrovati = true;
        });

        if (!mieiOrdiniTrovati) {
            container.innerHTML = '<div class="empty-state">Nessun ordine attivo al momento. Fai il tuo primo ordine!</div>';
        }
    });
</script>

</body>
</html>
